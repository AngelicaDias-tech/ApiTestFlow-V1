<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name) {
    @case ('home') {
      <path d="M4 11.5 12 4l8 7.5" />
      <path d="M6 10.3V20a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9.7" />
      <path d="M9.5 21v-5.3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V21" />
    }
    @case ('users') {
      <circle cx="9" cy="8.2" r="3" />
      <path d="M3.3 20c.7-3.2 3-5 5.7-5s5 1.8 5.7 5" />
      <circle cx="17.2" cy="9.4" r="2.3" />
      <path d="M15.6 12.3c2 .3 3.6 1.9 4.2 4.2" />
    }
    @case ('settings') {
      <circle cx="12" cy="12" r="3.1" />
      @for (a of gearAngles; track a) {
        <rect x="11.1" y="1.4" width="1.8" height="4.1" rx="0.9" [attr.transform]="'rotate(' + a + ' 12 12)'" />
      }
    }
    @case ('logout') {
      <path d="M9.5 4.2H6.3a2 2 0 0 0-2 2v11.6a2 2 0 0 0 2 2h3.2" />
      <path d="M14.8 16.2 19 12l-4.2-4.2" />
      <path d="M19 12H8.8" />
    }
    @case ('search') {
      <circle cx="10.4" cy="10.4" r="6.4" />
      <path d="m20 20-4.8-4.8" />
    }
    @case ('bell') {
      <path d="M6.2 9.2a5.8 5.8 0 1 1 11.6 0c0 4 1.4 5.4 1.4 5.4H4.8s1.4-1.4 1.4-5.4Z" />
      <path d="M10.2 18.8a1.9 1.9 0 0 0 3.6 0" />
    }
    @case ('plus') {
      <path d="M12 5v14" />
      <path d="M5 12h14" />
    }
    @case ('lightning') {
      <path d="M12.7 2.3 4.4 14h5.8l-.9 7.7L17.6 10h-5.8l.9-7.7Z" stroke-linejoin="round" />
    }
    @case ('shield') {
      <path d="M12 3.1 19 6v5.7c0 5-3.4 7.7-7 8.9-3.6-1.2-7-3.9-7-8.9V6l7-2.9Z" />
      <path d="m9 12.2 2 2 4-4.2" />
    }
    @case ('bar-chart') {
      <rect x="3.6" y="12.2" width="3.3" height="8" rx="1" />
      <rect x="10.3" y="7.3" width="3.3" height="12.9" rx="1" />
      <rect x="17" y="3.3" width="3.3" height="16.9" rx="1" />
    }
    @case ('chevron-right') {
      <path d="m9 6 6 6-6 6" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="8.3" />
      <path d="M12 7.6V12l3.1 2" />
    }
    @case ('cube') {
      <path d="m12 3 8 4.4v9.2L12 21l-8-4.4V7.4L12 3Z" stroke-linejoin="round" />
      <path d="m4 7.4 8 4.4 8-4.4" />
      <path d="M12 11.8V21" />
    }
    @case ('chevron-left') {
      <path d="m15 6-6 6 6 6" />
    }
    @case ('check') {
      <path d="m5 12.5 4.5 4.5L19 7" />
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="8.3" />
      <path d="m8.3 12.3 2.6 2.6 4.8-5.2" />
    }
    @case ('x') {
      <path d="m6 6 12 12" />
      <path d="m18 6-12 12" />
    }
    @case ('x-circle') {
      <circle cx="12" cy="12" r="8.3" />
      <path d="m9 9 6 6" />
      <path d="m15 9-6 6" />
    }
    @case ('file') {
      <path d="M7 3.5h7.2L18 7.3V19a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke-linejoin="round" />
      <path d="M14 3.5V7a1 1 0 0 0 1 1h3" />
    }
    @case ('upload-cloud') {
      <path d="M7.5 17.5a4.2 4.2 0 0 1-.7-8.3 5.4 5.4 0 0 1 10.4-1.7 3.9 3.9 0 0 1-.7 10h-1" />
      <path d="M12 20.5V12" />
      <path d="m9 14.8 3-3 3 3" />
    }
    @case ('download') {
      <path d="M12 3.5V15" />
      <path d="m7.5 11 4.5 4.5 4.5-4.5" />
      <path d="M5 18.5h14" />
    }
    @case ('play') {
      <path d="M7.5 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8a1 1 0 0 0-1.5.86Z" stroke-linejoin="round" />
    }
    @case ('more-vertical') {
      <circle cx="12" cy="5.2" r="1.15" fill="currentColor" stroke="none" />
      <circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none" />
      <circle cx="12" cy="18.8" r="1.15" fill="currentColor" stroke="none" />
    }
    @case ('trending-up') {
      <path d="m3.5 16 6-6.2 4 4 6.7-7.3" />
      <path d="M15.8 6.2h4.4v4.4" />
    }
  }
</svg>
